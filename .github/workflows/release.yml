name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build and publish Go binaries
    runs-on: ubuntu-latest
    env:
      # github.com/apikcloud/workspace-provider is a private repo — see
      # image/Dockerfile's own GOPRIVATE comment.
      GOPRIVATE: github.com/apikcloud/workspace-provider
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKSPACE_PROVIDER_SSH_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Fetch private Go modules over SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Cross-compile and archive
        run: make dist-archive

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/dist/*.tar.gz
            bin/dist/checksums.txt
          generate_release_notes: true

  docker:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKSPACE_PROVIDER_SSH_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: make image-push
        env:
          IMAGE_TAG: ${{ github.ref_name }}
