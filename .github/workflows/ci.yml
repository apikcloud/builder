name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  go:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    env:
      # github.com/apikcloud/workspace-provider is a private repo — see
      # image/Dockerfile's own GOPRIVATE comment. Skips the public module
      # proxy/checksum DB for it; the ssh-agent + insteadOf setup below
      # fetches it over SSH using a read-only deploy key instead.
      GOPRIVATE: github.com/apikcloud/workspace-provider
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKSPACE_PROVIDER_SSH_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Fetch private Go modules over SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build
        run: make build

      - name: Lint (go vet + gofmt)
        run: make lint

      - name: Test
        run: make test

  docker:
    name: Multi-arch image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKSPACE_PROVIDER_SSH_KEY }}

      - name: Build image (all platforms, no push)
        run: make image-verify
